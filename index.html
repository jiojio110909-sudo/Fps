{const tg=new THREE.PlaneGeometry(600,600,120,120);tg.rotateX(-Math.PI/2);const pa=tg.attributes.position,col=[];for(let i=0;i<pa.count;i++){const h=H(pa.getX(i),pa.getZ(i));pa.setY(i,h);const c=new THREE.Color();if(h<-1.5)c.set(0x8a7a52);else if(h>10)c.set(0x8c8f86);else c.setHSL(.27-Math.max(h,0)*.012,.38,.4+Math.max(h,0)*.012);col.push(c.r,c.g,c.b)}
